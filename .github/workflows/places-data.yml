name: Cool spots data

# Refreshes the saved list of cool spots (src/data/places.json) from OpenStreetMap once a
# month. The app answers from that file, so it doesn't depend on the busy public map
# servers while people are using it. Run it by hand to get a copy without committing.
on:
  schedule:
    - cron: "17 11 1 * *" # the 1st of each month, early morning in Phoenix
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the new file to main"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node artifacts/api-server/scripts/fetch-places.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: places
          path: artifacts/api-server/src/data/places.json
      - name: Commit
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/data/places.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh cool spots data"
          git push
