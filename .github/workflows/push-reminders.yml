name: Send due reminders

# Wakes the server every 5 minutes to send due reminders.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Ask the server to send what's due
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          site="$(tr -d '[:space:]' < .github/sombra-url 2>/dev/null || true)"
          if [ -z "$site" ]; then
            echo "::notice::Add the deployed site's address to .github/sombra-url to turn on scheduled reminders."
            exit 0
          fi
          # The secret header is optional; the endpoint is safe to call without it.
          for try in 1 2 3; do
            if curl -fsS --max-time 60 -X POST "${site%/}/api/push/run" ${PUSH_CRON_SECRET:+-H "x-push-cron: $PUSH_CRON_SECRET"}; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The server at $site didn't answer after three tries; reminders will go out on a later run."
