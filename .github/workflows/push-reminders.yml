name: Send due reminders

# Wakes sombra's server every 5 minutes so push reminders go out even when nobody has the
# app open (the Replit deployment sleeps between visits). GitHub may run scheduled jobs a
# few minutes late, so a reminder can arrive roughly 5-15 minutes after its time.
#
# The only setting: the deployed site's address, in .github/sombra-url (one line, e.g.
# https://sombra.example.app). Until it's filled in, this job does nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Ask the server to send what's due
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          site="$(tr -d '[:space:]' < .github/sombra-url 2>/dev/null || true)"
          if [ -z "$site" ]; then
            echo "::notice::Add the deployed site's address to .github/sombra-url to turn on scheduled reminders."
            exit 0
          fi
          # The secret header is optional; the endpoint is safe to call without it.
          curl -fsS --max-time 90 -X POST "${site%/}/api/push/run" ${PUSH_CRON_SECRET:+-H "x-push-cron: $PUSH_CRON_SECRET"}
          echo
