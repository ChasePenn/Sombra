name: Send due reminders

# Wakes sombra's server every 5 minutes so push reminders go out even when nobody has the
# app open (the Replit deployment sleeps between visits). GitHub may run scheduled jobs a
# few minutes late, so reminders can arrive up to roughly 5-15 minutes after their time.
# Does nothing until the PUSH_RUN_URL and PUSH_CRON_SECRET repository secrets are added.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the server to send what's due
        env:
          PUSH_RUN_URL: ${{ secrets.PUSH_RUN_URL }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$PUSH_RUN_URL" ] || [ -z "$PUSH_CRON_SECRET" ]; then
            echo "::notice::Push reminders aren't connected yet. Add the PUSH_RUN_URL and PUSH_CRON_SECRET repository secrets."
            exit 0
          fi
          curl -fsS --max-time 90 -X POST "$PUSH_RUN_URL" -H "x-push-cron: $PUSH_CRON_SECRET"
          echo
