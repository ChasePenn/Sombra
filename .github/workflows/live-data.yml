name: Live data check

# Calls the real weather, alert, air-quality and map services every morning and on every push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6 AM Phoenix time
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: |
          pnpm --filter @workspace/heat-safety test
          pnpm --filter @workspace/sombra exec node --test tests/best-window.test.js tests/summary.test.js tests/opening-hours.test.js
          pnpm --filter @workspace/api-server exec node --test tests/conditions.test.js
      - name: Live data
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/api-server run test:live 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up on the run page and in the API.
          grep -n -E "try [0-9] failed|Unable to load|failed with" live.log | head -20 | sed -E 's/^([0-9]+):/::warning::L\1 /'
          grep -n -E -A12 "not ok|✖" live.log | grep -vE "^--$" | head -45 | sed -E 's/^([0-9]+)[:-]/::error::L\1 /'
          if [ "$status" -ne 0 ]; then tail -n 15 live.log | nl -ba | sed -E 's/^ *([0-9]+)\t/::error::tail\1 /'; fi
          exit $status
      - name: Map server status
        if: always()
        shell: bash
        run: |
          q='[out:json][timeout:10];node["amenity"="library"](around:2000,33.45,-112.07);out 3;'
          for u in https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
            r=$(curl -s -o /tmp/o.json -w "%{http_code} %{time_total}s" -A "sombra-heat-safety (https://github.com/ChasePenn/sombra)" --max-time 20 --data-urlencode "data=$q" "$u" || echo "curl-failed")
            echo "::notice::$u -> $r $(head -c 120 /tmp/o.json 2>/dev/null | tr -d '\n')"
          done
