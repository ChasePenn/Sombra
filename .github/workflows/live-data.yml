name: Live data check

# Calls the real weather, alert, air-quality and map services every morning and on
# every push. If a service changes its format or returns impossible values, this fails
# and GitHub emails you, so bad data never reaches people unnoticed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6 AM Phoenix time
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: |
          pnpm --filter @workspace/heat-safety test
          pnpm --filter @workspace/sombra exec node --test tests/best-window.test.js tests/summary.test.js tests/opening-hours.test.js
          pnpm --filter @workspace/api-server exec node --test tests/conditions.test.js
      - name: Live data
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/api-server run test:live 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up on the run page and in the API.
          # GitHub merges identical annotation lines, so each line gets its line number.
          grep -n -E -A12 "not ok" live.log | grep -vE "^--$" | head -45 | sed -E 's/^([0-9]+)[:-]/::error::L\1 /'
          tail -n 15 live.log | nl -ba | sed -E 's/^ *([0-9]+)\t/::error::tail\1 /'
          exit $status
