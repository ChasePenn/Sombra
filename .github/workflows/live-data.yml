name: Live data check

# Calls the real weather, alert, air-quality and map services every morning and on
# every push. If a service changes its format or returns impossible values, this fails
# and GitHub emails you, so bad data never reaches people unnoticed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6 AM Phoenix time
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: |
          pnpm --filter @workspace/heat-safety test
          pnpm --filter @workspace/sombra exec node --test tests/best-window.test.js tests/summary.test.js tests/opening-hours.test.js
          pnpm --filter @workspace/api-server exec node --test tests/conditions.test.js
      - name: Live data
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/api-server run test:live 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up on the run page and in the API.
          # GitHub merges identical annotation lines, so each line gets its line number.
          grep -n -E -A12 "not ok" live.log | grep -vE "^--$" | head -45 | sed -E 's/^([0-9]+)[:-]/::error::L\1 /'
          tail -n 15 live.log | nl -ba | sed -E 's/^ *([0-9]+)\t/::error::tail\1 /'
          exit $status
      - name: Map server status
        if: always()
        shell: bash
        run: |
          q='[out:json][timeout:10];node["amenity"="library"](around:2000,33.45,-112.07);out 3;'
          for u in https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
            r=$(curl -s -o /tmp/o.json -w "%{http_code} %{time_total}s" -A "sombra-heat-safety (https://github.com/ChasePenn/sombra)" --max-time 20 --data-urlencode "data=$q" "$u" || echo "curl-failed")
            echo "::notice::$u -> $r $(head -c 120 /tmp/o.json 2>/dev/null | tr -d '\n')"
          done
          a='(around:3000,33.45,-112.07)'
          full="[out:json][timeout:15];(node[\"amenity\"=\"drinking_water\"]$a;nwr[\"amenity\"=\"library\"]$a;nwr[\"amenity\"=\"community_centre\"]$a;nwr[\"shop\"=\"mall\"]$a;node[\"amenity\"=\"shelter\"]$a;);out center 80;"
          r=$(curl -s -o /tmp/f.json -w "%{http_code} %{time_total}s" -A "sombra-heat-safety (https://github.com/ChasePenn/sombra)" --max-time 30 --data-urlencode "data=$full" https://overpass-api.de/api/interpreter || echo "curl-failed")
          echo "::notice::full query on main -> $r $(head -c 200 /tmp/f.json | tr -d '\n')"
          b='(33.423,-112.102,33.477,-112.038)'
          for t in 1 2; do
            bq="[out:json][timeout:15][bbox:33.423,-112.102,33.477,-112.038];(node[amenity=drinking_water];nwr[amenity~\"^(library|community_centre)$\"];nwr[shop=mall];node[amenity=shelter];);out center 80;"
            r=$(curl -s -o /tmp/b.json -w "%{http_code} %{time_total}s" -A "sombra-heat-safety (https://github.com/ChasePenn/sombra)" --max-time 30 --data-urlencode "data=$bq" https://overpass-api.de/api/interpreter || echo "curl-failed")
            echo "::notice::bbox query try $t -> $r $(head -c 160 /tmp/b.json | tr -d '\n')"
            sleep 5
          done
