kind = "web"
previewPath = "/"
title = "sombra"
description = "Heat-safety planner for Phoenix: hour-by-hour work, rest and water plans, alerts, cool spots and check-ins."
version = "1.0.0"
id = "artifacts/sombra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25823

[services.development]
run = "pnpm --filter @workspace/sombra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sombra", "run", "build" ]
serve = "static"
publicDir = "artifacts/sombra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25823"
BASE_PATH = "/"
